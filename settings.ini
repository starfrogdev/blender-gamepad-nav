# Tuning values and user settings for Gamepad Navigation, read by __init__.py on load.

[tuning]
# How often a connected controller is polled, in polls per second. Above 0.
poll_hz = 60
# Longest tick counted in seconds, which keeps a stall from jumping the view. Above 0 and at
# least one poll interval.
max_step = 0.1
# Seconds between looks for a controller while none is connected. Above 0.
rescan_interval = 1.0
# Trigger travel ignored before sprint or crawl starts. From 0 up to but not including 1.
# It only needs to cover trigger noise, around 0 to 0.2.
dead_trigger = 0.05
# Steepest look allowed, as the sine of the tilt above or below the horizon. Between 0 and 1.
# 0.98 is about 78.5°. At 1 the view can reach straight up or down and flip over.
pitch_limit = 0.98
# Closest an orthographic view may zoom, in metres. Above 0.
min_ortho_distance = 0.05

# Each [setting.<name>] becomes one add-on preference, in this order. Its type is float or
# bool. A float takes min, max, and an optional Blender subtype.

[setting.speed]
type = float
name = Move speed (m/s)
default = 3.0
min = 0.05
max = 100.0
description = Flying speed with the stick pushed all the way

[setting.look_speed]
type = float
name = Look speed (°/s)
default = 120.0
min = 10.0
max = 720.0
description = Turning speed with the right stick pushed all the way

[setting.invert_look]
type = bool
name = Invert look up/down
default = false
description = Push the right stick up to look down

[setting.sprint]
type = float
name = Sprint (right trigger) ×
default = 4.0
min = 1.0
max = 20.0
description = Speed multiplier with the right trigger fully pressed

[setting.crawl]
type = float
name = Crawl (left trigger) ×
default = 0.2
min = 0.01
max = 1.0
description = Speed multiplier with the left trigger fully pressed

[setting.dead_zone]
type = float
name = Stick dead zone
default = 0.15
min = 0.0
max = 0.5
subtype = FACTOR
description = How far a stick must move before it counts. Raise it if the view drifts on its own

[setting.auto_start]
type = bool
name = Start automatically
default = true
description = Start listening for a controller when Blender starts

[setting.only_when_focused]
type = bool
name = Only while Blender is focused
default = true
description = Ignore the controller while another app is in front. Windows only for now
